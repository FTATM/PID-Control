services:
  web:
    build: .
    container_name: pid-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    env_file: .env         # ค่าทั้งหมดอ่านจาก .env
    environment:           # ค่าใน .env เป็นของ XAMPP (localhost) จึงทับเฉพาะค่าที่ต้องใช้ภายใน Docker network
      DB_HOST: db          # ชื่อ service ของ database
      DB_PORT: 5432        # port ภายใน Docker network (ห้ามเปลี่ยน)
      MQTT_HOST: mqtt      # ชื่อ service ของ broker
      MQTT_PORT: 1883      # port ภายใน Docker network (ห้ามเปลี่ยน, port ฝั่งเครื่องตั้งที่ MQTT_PORT ใน .env)
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

  # รับข้อมูล ESP32 จาก MQTT แล้วบันทึกลง database (ใช้ image เดียวกับ web)
  mqtt-worker:
    build: .
    container_name: pid-mqtt-worker
    restart: unless-stopped
    init: true             # ให้ docker stop หยุด php ได้ทันที
    command: ["php", "workers/mqtt_worker.php"]
    env_file: .env         # ค่าทั้งหมดอ่านจาก .env (เหมือน web)
    environment:
      DB_HOST: db
      DB_PORT: 5432
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      RUN_MIGRATIONS: "false"   # ให้ web เป็นคนรัน migration
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
      web:
        condition: service_started

  mqtt:
    build: ./docker/mosquitto
    container_name: pid-mqtt
    restart: unless-stopped
    environment:
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASS: ${MQTT_PASS:-}
      TZ: Asia/Bangkok
    volumes:
      - mqttdata:/mosquitto/data
    ports:
      - "${MQTT_PORT:-1883}:1883"        # ESP32 / PLC ต่อที่ IP-เครื่อง:1883
      - "${MQTT_WS_PORT:-9001}:9001"     # MQTT over WebSocket สำหรับหน้าเว็บ

  db:
    image: postgres:17
    container_name: pid-db
    restart: unless-stopped
    env_file: .env         # ค่าทั้งหมดอ่านจาก .env (เหมือน web)
    environment:
      POSTGRES_DB: ${DB_NAME:-pid}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      TZ: Asia/Bangkok
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_EXPOSE_PORT:-5433}:5432"   # ต่อจาก DBeaver/pgAdmin บนเครื่องได้ที่ port 5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-pid}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  mqttdata:
