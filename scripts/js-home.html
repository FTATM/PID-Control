<script>
    const params = new URLSearchParams(window.location.search);

    const esp32_id = params.get("id") ?? 1;
    let chart = null;
    let allowKey = ['sp', 'pv'];

    // ===================== Realtime config =====================
    const CHART_WINDOW_MS = 30 * 1000;  // กราฟแสดงย้อนหลัง 30 วินาที
    const HISTORY_LIMIT = 300;          // จำนวน logs ที่โหลดจาก DB (พอสำหรับ 10 ครั้ง/วินาที x 30 วินาที)
    // ไม่มีข้อความ MQTT เกิน 3 เท่าของรอบส่งของ ESP32 -> กลับไป polling จาก DB
    // (ต่ำสุด 3 วินาที สูงสุด 30 วินาที เพื่อไม่ให้สถานะกระพริบเมื่อ ESP32 ส่งช้า)
    const STALE_FACTOR = 3;
    const STALE_MIN_MS = 3000;
    const STALE_MAX_MS = 30000;
    const DECIMAL_FIELDS = ['sp', 'error', 'kp', 'ki', 'kd', 'pv', 'mv', 'sv'];

    let currentData = null;   // ค่าล่าสุดของ esp32_sets
    let logs = [];            // ข้อมูลกราฟ
    let mqttClient = null;
    let lastLiveAt = 0;       // เวลาที่ได้รับข้อความ MQTT ล่าสุด
    let liveIntervalMs = 0;   // ระยะห่างเฉลี่ยระหว่างข้อความ MQTT (รอบส่งของ ESP32)
    let mqttStatus = null;    // 't' / 'f' จาก topic status (ใหม่กว่าค่าใน DB เสมอ)
    let renderPending = false;

    document.addEventListener('DOMContentLoaded', async () => {
        await process();
        setinitState();
        setTimeInterval(1000);
        connectMqtt();
    });

    async function setTimeInterval(millisecond) {
        setInterval(() => {
            setDateInit();

            // มีข้อมูลสดจาก MQTT อยู่ = ไม่ต้อง fetch
            // ESP32 ที่ยังส่งผ่าน HTTP หรือ MQTT หลุด = fetch จาก DB ทุก 1 วินาทีเหมือนเดิม
            const isLive = mqttClient?.connected && Date.now() - lastLiveAt < getStaleMs();
            if (!isLive) {
                process();
            }
            setMqttMode(isLive);
        }, millisecond);
    }

    // โหลดค่าล่าสุด + ประวัติจาก database
    async function process() {
        const data = await loadDataById(esp32_id);
        if (!data || !data.id) return;

        const { logs: history, ...sets } = data;
        currentData = sets;
        logs = history ?? [];

        // สถานะจาก MQTT สดกว่า DB (เช่นตอน worker ยังไม่ได้บันทึก) อย่าให้ค่าเก่าจาก DB ทับ
        if (mqttClient?.connected && mqttStatus) {
            currentData.is_connected = mqttStatus;
        }
        pruneLogs();
        scheduleRender();
    }

    // วาดใหม่ไม่เกิน 1 ครั้งต่อ frame แม้ข้อความ MQTT จะมาถี่
    function scheduleRender() {
        if (renderPending) return;
        renderPending = true;

        requestAnimationFrame(() => {
            renderPending = false;
            if (!currentData) return;

            setValueInHTML(currentData);
            if (logs.length > 0) {
                initChart('chart', prepareDatasets({ logs }));
            }
        });
    }

    function toTime(value) {
        return value instanceof Date ? value.getTime() : new Date(String(value).replace(' ', 'T')).getTime();
    }

    // เก็บเฉพาะข้อมูลในช่วง CHART_WINDOW_MS ล่าสุด
    function pruneLogs() {
        if (logs.length === 0) return;

        const newest = Math.max(...logs.map(item => toTime(item.created_at)));
        logs = logs.filter(item => toTime(item.created_at) >= newest - CHART_WINDOW_MS);
    }

    // ===================== MQTT (realtime) =====================
    function getStaleMs() {
        return clamp(liveIntervalMs * STALE_FACTOR, STALE_MIN_MS, STALE_MAX_MS);
    }

    // วัดรอบส่งของ ESP32 แบบค่าเฉลี่ย (ไม่นับช่วงที่หายไปนาน เช่น ESP32 ปิดเครื่อง)
    function updateLiveInterval() {
        const now = Date.now();
        const gap = now - lastLiveAt;

        if (lastLiveAt && gap <= STALE_MAX_MS) {
            liveIntervalMs = liveIntervalMs ? liveIntervalMs * 0.8 + gap * 0.2 : gap;
        }
        lastLiveAt = now;
    }

    // แสดงสถานะแหล่งข้อมูลใน MQTT Guide
    function setMqttMode(isLive) {
        const badge = document.getElementById('mqtt-mode');
        if (!badge) return;

        let text = 'Polling DB (1s) · broker not connected';
        let color = 'bg-red-50 text-red-600 dark:bg-red-950 dark:text-red-300';
        if (isLive) {
            text = 'Live via MQTT';
            color = 'bg-green-50 text-green-600 dark:bg-green-950 dark:text-green-300';
        } else if (mqttClient?.connected) {
            text = 'Polling DB (1s) · no MQTT data from ESP32';
            color = 'bg-amber-50 text-amber-600 dark:bg-amber-950 dark:text-amber-300';
        }

        badge.textContent = text;
        badge.className = 'text-[11px] font-semibold px-2 py-0.5 rounded-full ' + color;
    }

    function connectMqtt() {
        if (typeof mqtt === 'undefined' || typeof MQTT_CONFIG === 'undefined') {
            console.warn('MQTT not available, use polling');
            return;
        }

        const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
        const url = `${protocol}://${location.hostname}:${MQTT_CONFIG.port}`;
        const topicState = `pid/esp32/${esp32_id}/state`;
        const topicStatus = `pid/esp32/${esp32_id}/status`;

        mqttClient = mqtt.connect(url, {
            username: MQTT_CONFIG.user || undefined,
            password: MQTT_CONFIG.pass || undefined,
            reconnectPeriod: 3000,
            connectTimeout: 5000,
        });

        mqttClient.on('connect', () => {
            console.log('MQTT connected: ' + url);
            mqttClient.subscribe([topicState, topicStatus]);
        });

        mqttClient.on('offline', () => {
            console.warn('MQTT offline, fallback to polling');
        });

        mqttClient.on('error', (err) => {
            console.error('MQTT error: ' + err.message);
        });

        mqttClient.on('message', (topic, payload) => {
            if (!currentData) return;

            const message = payload.toString();
            if (topic === topicState) {
                onMqttState(message);
            } else if (topic === topicStatus) {
                onMqttStatus(message);
            }
        });
    }

    function onMqttState(message) {
        let data;
        try {
            data = JSON.parse(message);
        } catch (err) {
            console.warn('MQTT invalid JSON: ' + message);
            return;
        }
        if (!data || typeof data !== 'object') return;

        // รวมค่าใหม่เข้ากับค่าล่าสุด (ESP32 อาจส่งมาไม่ครบทุก field) ให้รูปแบบเหมือนข้อมูลจาก DB
        for (const [key, value] of Object.entries(data)) {
            if (typeof value === 'boolean') {
                currentData[key] = value ? 't' : 'f';
            } else if (DECIMAL_FIELDS.includes(key) && !isNaN(value)) {
                currentData[key] = Number(value).toFixed(2);
            } else {
                currentData[key] = value;
            }
        }

        logs.push({ ...currentData, created_at: new Date() });
        updateLiveInterval();
        pruneLogs();
        scheduleRender();
    }

    function onMqttStatus(message) {
        const status = message.trim().toLowerCase();
        if (status !== 'online' && status !== 'offline') return;

        mqttStatus = status === 'online' ? 't' : 'f';
        currentData.is_connected = mqttStatus;
        scheduleRender();
    }

    function setinitState() {
        const checkboxes = document.querySelectorAll(".allow-checkbox");
        checkboxes.forEach(cb => {
            cb.addEventListener("change", function () {

                const value = this.value;

                if (this.checked) {
                    // เพิ่มค่า
                    if (!allowKey.includes(value)) {
                        allowKey.push(value);
                    }

                } else {
                    // ลบค่า
                    allowKey = allowKey.filter(item => item !== value);
                }

                console.log("allowKey:", allowKey);
                scheduleRender();
            });
        });
    }


    async function loadDataById(id) {
        try {
            const res = await fetch(`../api/fetch-setsById.php?id=${id}&limit=${HISTORY_LIMIT}`);
            const raw = await res.json();
            const data = raw.data ?? [];

            return data;
        } catch (err) {
            console.error('error : ' + err);
        }
    }

    function setValueInHTML(data) {
        SetValueInHTMLById('sp', data['sp'] ?? '-');
        SetValueInHTMLById('error', data['error'] ?? '-');
        SetValueInHTMLById('kp', data['kp'] ?? '-');
        SetValueInHTMLById('ki', data['ki'] ?? '-');
        SetValueInHTMLById('kd', data['kd'] ?? '-');
        SetValueInHTMLById('pv', data['pv'] ?? '-');
        SetValueInHTMLById('mv', data['mv'] ?? '-');
        SetValueInHTMLById('multi-kp', "x" + data['multi_kp'] ?? '-');
        SetValueInHTMLById('multi-ki', "x" + data['multi_ki'] ?? '-');
        SetValueInHTMLById('multi-kd', "x" + data['multi_kd'] ?? '-');
        // SetValueInHTMLById('sv', data['sv'] ?? '-');

        const btn = document.getElementById('btn-resetwifi');
        const is_conn = document.getElementById('is_connect');
        const is_status = document.getElementById('is_status');
        // ===== Update UI =====
        if (btn) {
            btn.disabled = data['is_connected'] == 't' ? false : true;
        } else {
            console.warn('Not found Element id : btn-resetwifi');
        }
        if (is_conn) {
            is_conn.textContent = data['is_connected'] == 't' ? "Connected" : "Not Connected";
        } else {
            console.warn('Not found Element id : is_connect');
        }

        if (is_status) {
            is_status.classList.remove(data['is_connected'] == 't' ? "bg-red-500" : "bg-green-500");
            is_status.classList.add(data['is_connected'] == 't' ? "bg-green-500" : "bg-red-500");
        } else {
            console.warn('Not found Element id : is_status');
        }

    }

    function prepareDatasets(data) {
        if (!data || !data.logs) return null;

        const logs = [...data.logs].sort((a, b) =>
            new Date(a.created_at) - new Date(b.created_at)
        );

        const labels = logs.map(item => item.created_at);
        const spData = logs.map(item => parseFloat(item.sp));
        const pvData = logs.map(item => parseFloat(item.pv));
        const kpData = logs.map(item => parseFloat(item.kp));
        const kiData = logs.map(item => parseFloat(item.ki));
        const kdData = logs.map(item => parseFloat(item.kd));


        let datasets = [];
        let allValues = [];

        if (allowKey.includes('sp')) {
            datasets.push({
                label: 'SP',
                data: spData,
                borderColor: '#ef4444',
                backgroundColor: '#ef4444',
                borderWidth: 3,
                tension: 0.3,
                cubicInterpolationMode: 'monotone',
                pointRadius: 0,
                pointHoverRadius: 0
            });
            allValues.push(...spData);
        }

        if (allowKey.includes('pv')) {
            datasets.push({
                label: 'PV',
                data: pvData,
                borderColor: '#1A3FB8',
                backgroundColor: '#FFFFFF',
                borderWidth: 3,
                tension: 0.3,
                cubicInterpolationMode: 'monotone',
                pointRadius: 0,
                pointHoverRadius: 0
            });
            allValues.push(...pvData);
        }
        

        if (allowKey.includes('kp')) {
            datasets.push({
                label: 'Kp',
                data: kpData,
                borderColor: '#FFE600',
                backgroundColor: '#808080',
                borderWidth: 3,
                tension: 0.3,
                cubicInterpolationMode: 'monotone',
                pointRadius: 0,
                pointHoverRadius: 0
            });
            allValues.push(...kpData);
        }

        if (allowKey.includes('ki')) {
            datasets.push({
                label: 'Ki',
                data: kiData,
                borderColor: '#00FFFF',
                backgroundColor: '#808080',
                borderWidth: 3,
                tension: 0.3,
                cubicInterpolationMode: 'monotone',
                pointRadius: 0,
                pointHoverRadius: 0
            });
            allValues.push(...kiData);
        }

        if (allowKey.includes('kd')) {
            datasets.push({
                label: 'Kd',
                data: kdData,
                borderColor: '#8000FF',
                backgroundColor: '#808080',
                borderWidth: 3,
                tension: 0.3,
                cubicInterpolationMode: 'monotone',
                pointRadius: 0,
                pointHoverRadius: 0
            });
            allValues.push(...kdData);
        }

        // รวมข้อมูลทั้งหมดเพื่อหาค่า min / max

        const min = Math.min(...allValues);
        const max = Math.max(...allValues);

        return {
            labels,
            datasets,
            min,
            max
        };
    }

    function initChart(id, chartData) {

        if (!chartData) return;

        const ctx = document.getElementById(id);

        const yMax = chartData.max + chartData.max * 0.5;

        const axisColor = isDarkMode() ? '#FFFFFF' : '#6B7280';

        if (!chart) {
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.labels,
                    datasets: chartData.datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'second',
                                displayFormats: {
                                    second: 'ss'
                                },
                                tooltipFormat: 'HH:mm:ss.SSS'
                            },
                            ticks: {
                                color: axisColor,
                                autoSkip: true
                            },
                            grid: {
                                display: false
                            }
                        },
                        y: {
                            min: 0,
                            max: yMax,
                            ticks: {
                                font: { size: fontSize },
                                color: axisColor,
                                callback: v => v.toFixed(1)
                            },
                            grid: {
                                color: 'rgba(0,0,0,0.05)'
                            }
                        }
                    }
                }
            });
        } else {
            chart.data.labels = chartData.labels;
            chart.data.datasets = chartData.datasets;

            // chart.options.scales.y.min = yMin;
            chart.options.scales.y.max = yMax;

            // 👇 update color ตอน update
            chart.options.scales.x.ticks.color = axisColor;
            chart.options.scales.y.ticks.color = axisColor;

            chart.options.scales.y.grid.color = isDarkMode()
                ? 'rgba(255,255,255,0.1)'
                : 'rgba(0,0,0,0.05)';

            chart.update('none');
        }
    }

    async function resetWifi() {
        console.log("========================= resetwifi =====================");

        const btn = document.getElementById('btn-resetwifi');
        const is_conn = document.getElementById('is_connect');
        const is_status = document.getElementById('is_status');

        if (!btn) {
            console.warn("Not found Element id : btn-resetwifi");
            return;
        }

        btn.disabled = true;

        // 1) ส่งคำสั่งผ่าน MQTT ก่อน (ESP32 ที่ใช้ MQTT ได้รับทันที ไม่ขึ้นกับ API)
        let sentMqtt = false;
        if (mqttClient?.connected) {
            mqttClient.publish(`pid/esp32/${esp32_id}/cmd`, JSON.stringify({ reset_wifi: true }), { qos: 1 });
            sentMqtt = true;
            console.log(`MQTT -> pid/esp32/${esp32_id}/cmd {"reset_wifi":true}`);
        }

        // 2) บันทึก flag ลง DB (ESP32 ที่ใช้ HTTP อ่าน is_resetwifi จาก DB เหมือนเดิม)
        let savedDb = false;
        try {
            const res = await fetch(`../api/update-setsById.php?id=${esp32_id}`, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    "is_connected": "f",
                    "is_resetwifi": "t"
                })
            });

            if (!res.ok) {
                throw new Error(`HTTP Error ${res.status}`);
            }

            const raw = await res.json();
            savedDb = raw.success === true;

            if (!savedDb) {
                console.error("error => " + raw.message);
            }
        } catch (err) {
            console.error("Reset Wifi Error:", err);
        }

        // 3) แจ้งผล
        if (!sentMqtt && !savedDb) {
            Swal.fire({ icon: 'error', title: 'Reset WiFi failed', text: 'Cannot reach the MQTT broker or the API.' });
            btn.disabled = false;
            return;
        }

        if (!sentMqtt) {
            Swal.fire({ icon: 'warning', title: 'Saved to DB only', text: 'MQTT broker is not connected, so an ESP32 using MQTT will not receive this command.' });
        } else {
            Swal.fire({ icon: 'success', title: 'Reset WiFi sent', toast: true, position: 'top-end', timer: 2500, showConfirmButton: false });
        }

        console.log("Reset Wifi Success.");

        // ถือว่าหลุดจนกว่า ESP32 จะส่ง "online" กลับมา
        if (mqttStatus) {
            mqttStatus = 'f';
        }
        if (currentData) {
            currentData.is_connected = 'f';
        }

        // ===== Update UI =====
        if (is_conn) {
            is_conn.textContent = "Not Connected";
        } else {
            console.warn('Not found Element id : is_connect');
        }

        if (is_status) {
            is_status.classList.remove("bg-green-500");
            is_status.classList.add("bg-red-500");
        } else {
            console.warn('Not found Element id : is_status');
        }
    }
</script>
