<script>
    const params = new URLSearchParams(window.location.search);

    const esp32_id = params.get("id") ?? 1;
    let chart = null;
    let allowKey = ['sp', 'pv'];

    // ===================== Realtime config =====================
    // ช่วงเวลาของกราฟ เลือกได้จาก dropdown #chart-window (วินาที) จำค่าไว้ใน localStorage
    const CHART_WINDOW_KEY = 'pid-chart-window';
    let chartWindowMs = 30 * 1000;
    const HISTORY_LIMIT = 600;          // จำนวนจุดสูงสุดบนกราฟ (ช่วงยาว server จะเลือกทุกๆ N แถว)
    // ไม่มีข้อความ MQTT เกิน 3 เท่าของรอบส่งของ ESP32 -> กลับไป polling จาก DB
    // (ต่ำสุด 3 วินาที สูงสุด 30 วินาที เพื่อไม่ให้สถานะกระพริบเมื่อ ESP32 ส่งช้า)
    const STALE_FACTOR = 3;
    const STALE_MIN_MS = 3000;
    const STALE_MAX_MS = 30000;
    const DECIMAL_FIELDS = ['sp', 'error', 'kp', 'ki', 'kd', 'pv', 'mv', 'sv', 'relay'];

    let currentData = null;   // ค่าล่าสุดของ esp32_sets
    let logs = [];            // ข้อมูลกราฟ
    let resetAfterMs = 0;     // กด Reset แล้ว: ไม่แสดง logs ที่เก่ากว่าเวลานี้ (refresh หน้า = แสดงทั้งหมดอีกครั้ง)
    let mqttClient = null;
    let lastLiveAt = 0;       // เวลาที่ได้รับข้อความ MQTT ล่าสุด
    let liveIntervalMs = 0;   // ระยะห่างเฉลี่ยระหว่างข้อความ MQTT (รอบส่งของ ESP32)
    let mqttStatus = null;    // 't' / 'f' จาก topic status (ใหม่กว่าค่าใน DB เสมอ)
    let renderPending = false;

    // ===================== Export CSV / Excel =====================
    const EXPORT_COLUMNS = [
        ['created_at', 'Time'], ['sp', 'SP'], ['pv', 'PV'], ['error', 'Error'],
        ['kp', 'Kp'], ['ki', 'Ki'], ['kd', 'Kd'], ['mv', 'MV'], ['sv', 'SV'], ['relay', 'Relay'],
        ['multi_kp', 'Multi Kp'], ['multi_ki', 'Multi Ki'], ['multi_kd', 'Multi Kd'], ['is_connected', 'Connected']
    ];

    async function exportLogs(format) {
        const pad = n => String(n).padStart(2, '0');
        const nowLocal = () => {
            const d = new Date();
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        };

        const { isConfirmed, value } = await Swal.fire({
            title: format === 'csv' ? 'Export CSV' : 'Export Excel',
            html: `
                <div style="text-align:left;font-size:14px">
                    <label>ช่วงเวลา</label>
                    <select id="exp-range" class="swal2-select" style="width:100%;margin:6px 0 12px">
                        <option value="1">1 ชั่วโมงล่าสุด</option>
                        <option value="24" selected>24 ชั่วโมงล่าสุด</option>
                        <option value="168">7 วันล่าสุด</option>
                        <option value="720">30 วันล่าสุด</option>
                        <option value="custom">กำหนดเอง</option>
                    </select>
                    <div id="exp-custom" style="display:none">
                        <label>จาก</label><input id="exp-from" type="datetime-local" class="swal2-input" style="width:100%;margin:6px 0 12px">
                        <label>ถึง</label><input id="exp-to" type="datetime-local" class="swal2-input" style="width:100%;margin:6px 0 0">
                    </div>
                </div>`,
            showCancelButton: true,
            confirmButtonText: 'Download',
            cancelButtonText: 'ยกเลิก',
            didOpen: () => {
                document.getElementById('exp-to').value = nowLocal();
                document.getElementById('exp-range').addEventListener('change', e => {
                    document.getElementById('exp-custom').style.display = e.target.value === 'custom' ? 'block' : 'none';
                });
            },
            preConfirm: () => {
                const range = document.getElementById('exp-range').value;
                if (range !== 'custom') return { hours: range };
                const from = document.getElementById('exp-from').value;
                const to = document.getElementById('exp-to').value;
                if (!from) {
                    Swal.showValidationMessage('กรุณาเลือกเวลาเริ่มต้น');
                    return false;
                }
                return { from, to };
            }
        });
        if (!isConfirmed) return;

        Swal.fire({ title: 'กำลังเตรียมข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        try {
            const qs = new URLSearchParams({ id: esp32_id, ...value });
            const res = await fetch(`../api/export-logs.php?${qs}`);
            const raw = await res.json();
            if (!raw.success) throw new Error(raw.message || 'export failed');

            if (raw.data.length === 0) {
                Swal.fire({ icon: 'info', title: 'ไม่มีข้อมูลในช่วงเวลานี้' });
                return;
            }

            const header = EXPORT_COLUMNS.map(c => c[1]);
            const table = raw.data.map(r => EXPORT_COLUMNS.map(([key]) => {
                const v = r[key];
                if (key === 'created_at') return String(v).substring(0, 19);
                if (key === 'is_connected') return (v === 't' || v === true) ? 1 : 0;
                return v === null || v === '' ? '' : Number(v);
            }));

            const stamp = new Date().toISOString().substring(0, 19).replace(/[T:]/g, '-');
            const base = `pid_${raw.device.device_id}_${stamp}`;

            if (format === 'csv') {
                const esc = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v;
                const csv = [header, ...table].map(row => row.map(esc).join(',')).join('\r\n');
                // BOM ให้ Excel อ่านภาษาไทยถูกต้อง
                downloadBlob(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }), `${base}.csv`);
            } else {
                if (typeof XLSX === 'undefined') throw new Error('โหลด library Excel ไม่สำเร็จ');
                const ws = XLSX.utils.aoa_to_sheet([header, ...table]);
                ws['!cols'] = header.map((h, i) => ({ wch: i === 0 ? 20 : 11 }));
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, String(raw.device.device_id).substring(0, 31));
                XLSX.writeFile(wb, `${base}.xlsx`);
            }

            if (raw.truncated) {
                Swal.fire({ icon: 'warning', title: 'ข้อมูลถูกตัด', text: `มีข้อมูลมากกว่า ${raw.max_rows.toLocaleString()} แถว ไฟล์นี้มีเฉพาะส่วนแรก ลองเลือกช่วงเวลาที่สั้นลง` });
            } else {
                Swal.fire({ icon: 'success', title: `ดาวน์โหลดแล้ว (${table.length.toLocaleString()} แถว)`, toast: true, position: 'top-end', timer: 2500, showConfirmButton: false });
            }
        } catch (err) {
            console.error('Export error:', err);
            Swal.fire({ icon: 'error', title: 'Export ไม่สำเร็จ', text: err.message });
        }
    }

    function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // ===================== Device switcher =====================
    let deviceList = [];

    function escHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function loadDeviceList() {
        try {
            const res = await fetch('../api/fetch-sets.php');
            const raw = await res.json();
            deviceList = raw.data ?? [];
        } catch (err) {
            console.error('error : ' + err);
        }
        renderDeviceSwitcher();
    }

    function renderDeviceSwitcher() {
        const cur = deviceList.find(d => d.device_id === String(esp32_id));
        document.getElementById('device-current').textContent =
            cur ? `${cur.name} (${cur.device_id})` : String(esp32_id);

        const multi = deviceList.length > 1;
        document.getElementById('device-caret').classList.toggle('hidden', !multi);
        document.getElementById('device-switch-btn').classList.toggle('cursor-default', !multi);

        document.getElementById('device-menu').innerHTML = deviceList.map(d => {
            const active = d.device_id === String(esp32_id);
            const on = d.is_connected === 't' || d.is_connected === true;
            return `<a href="?id=${encodeURIComponent(d.device_id)}"
                class="flex items-center gap-2 px-3 py-2 text-sm dark:text-white hover:bg-stone-100 dark:hover:bg-slate-800 ${active ? 'font-bold bg-orange-50 dark:bg-slate-800' : ''}">
                <span class="w-2 h-2 rounded-full ${on ? 'bg-green-500' : 'bg-red-500'}"></span>
                <span class="flex-1">${escHtml(d.name)}</span>
                <span class="font-mono text-xs text-stone-400">${escHtml(d.device_id)}</span>
            </a>`;
        }).join('');
    }

    function toggleDeviceMenu() {
        if (deviceList.length <= 1) return;
        document.getElementById('device-menu').classList.toggle('hidden');
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('#device-switch-btn') && !e.target.closest('#device-menu')) {
            document.getElementById('device-menu')?.classList.add('hidden');
        }
    });

    document.addEventListener('DOMContentLoaded', async () => {
        loadDeviceList();
        setChartWindowSelect();
        await process();
        setinitState();
        setTimeInterval(1000);
        connectMqtt();
    });

    async function setTimeInterval(millisecond) {
        setInterval(() => {
            setDateInit();

            // มีข้อมูลสดจาก MQTT อยู่ = ไม่ต้อง fetch
            // ESP32 ที่ยังส่งผ่าน HTTP หรือ MQTT หลุด = fetch จาก DB ทุก 1 วินาทีเหมือนเดิม
            const isLive = mqttClient?.connected && Date.now() - lastLiveAt < getStaleMs();
            if (!isLive) {
                process();
            }
            setMqttMode(isLive);
        }, millisecond);
    }

    // โหลดค่าล่าสุด + ประวัติจาก database
    async function process() {
        const data = await loadDataById(esp32_id);
        if (!data || !data.id) return;

        const { logs: history, ...sets } = data;
        currentData = sets;
        logs = history ?? [];

        // สถานะจาก MQTT สดกว่า DB (เช่นตอน worker ยังไม่ได้บันทึก) อย่าให้ค่าเก่าจาก DB ทับ
        if (mqttClient?.connected && mqttStatus) {
            currentData.is_connected = mqttStatus;
        }
        pruneLogs();
        scheduleRender();
    }

    // วาดใหม่ไม่เกิน 1 ครั้งต่อ frame แม้ข้อความ MQTT จะมาถี่
    function scheduleRender() {
        if (renderPending) return;
        renderPending = true;

        requestAnimationFrame(() => {
            renderPending = false;
            if (!currentData) return;

            setValueInHTML(currentData);
            if (logs.length > 0) {
                initChart('chart', prepareDatasets({ logs }));
            } else if (chart) {
                chart.data.labels = [];
                chart.data.datasets = [];
                chart.update('none');
            }
        });
    }

    // ล้างเส้นบนกราฟ (ไม่ลบ logs ใน DB) เริ่มวาดใหม่จากข้อมูลที่เข้ามาหลังกดปุ่ม
    // ใช้เวลาของ log ล่าสุดเป็นจุดตัด แทนเวลาของ browser เผื่อนาฬิกาไม่ตรงกับ server
    function resetLogs() {
        if (logs.length > 0) {
            resetAfterMs = Math.max(...logs.map(item => toTime(item.created_at)));
        }
        logs = [];
        scheduleRender();
    }

    function toTime(value) {
        return value instanceof Date ? value.getTime() : new Date(String(value).replace(' ', 'T')).getTime();
    }

    // เก็บเฉพาะข้อมูลในช่วง chartWindowMs ล่าสุด และใหม่กว่าตอนกด Reset
    function pruneLogs() {
        if (logs.length === 0) return;

        const newest = Math.max(...logs.map(item => toTime(item.created_at)));
        logs = logs.filter(item => {
            const time = toTime(item.created_at);
            return time >= newest - chartWindowMs && time > resetAfterMs;
        });
    }

    function setChartWindowSelect() {
        const select = document.getElementById('chart-window');
        if (!select) return;

        try {
            const saved = localStorage.getItem(CHART_WINDOW_KEY);
            if (saved && select.querySelector(`option[value="${saved}"]`)) {
                select.value = saved;
            }
        } catch (err) { }
        chartWindowMs = Number(select.value) * 1000;

        select.addEventListener('change', () => {
            chartWindowMs = Number(select.value) * 1000;
            try { localStorage.setItem(CHART_WINDOW_KEY, select.value); } catch (err) { }
            process();   // โหลดประวัติช่วงใหม่จาก DB ทันที
        });
    }

    // หน่วยแกน X ตามช่วงเวลาที่เลือก
    function getTimeScale() {
        if (chartWindowMs <= 60 * 1000) return { unit: 'second', format: 'ss' };
        if (chartWindowMs <= 3600 * 1000) return { unit: 'minute', format: 'HH:mm' };
        return { unit: 'hour', format: 'HH:mm' };
    }

    // ===================== MQTT (realtime) =====================
    function getStaleMs() {
        return clamp(liveIntervalMs * STALE_FACTOR, STALE_MIN_MS, STALE_MAX_MS);
    }

    // วัดรอบส่งของ ESP32 แบบค่าเฉลี่ย (ไม่นับช่วงที่หายไปนาน เช่น ESP32 ปิดเครื่อง)
    function updateLiveInterval() {
        const now = Date.now();
        const gap = now - lastLiveAt;

        if (lastLiveAt && gap <= STALE_MAX_MS) {
            liveIntervalMs = liveIntervalMs ? liveIntervalMs * 0.8 + gap * 0.2 : gap;
        }
        lastLiveAt = now;
    }

    // แสดงสถานะแหล่งข้อมูลใน MQTT Guide
    function setMqttMode(isLive) {
        const badge = document.getElementById('mqtt-mode');
        if (!badge) return;

        let text = 'Polling DB (1s) · broker not connected';
        let color = 'bg-red-50 text-red-600 dark:bg-red-950 dark:text-red-300';
        if (isLive) {
            text = 'Live via MQTT';
            color = 'bg-green-50 text-green-600 dark:bg-green-950 dark:text-green-300';
        } else if (mqttClient?.connected) {
            text = 'Polling DB (1s) · no MQTT data from ESP32';
            color = 'bg-amber-50 text-amber-600 dark:bg-amber-950 dark:text-amber-300';
        }

        badge.textContent = text;
        badge.className = 'text-[11px] font-semibold px-2 py-0.5 rounded-full ' + color;
    }

    function connectMqtt() {
        if (typeof mqtt === 'undefined' || typeof MQTT_CONFIG === 'undefined') {
            console.warn('MQTT not available, use polling');
            return;
        }

        const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
        const url = `${protocol}://${location.hostname}:${MQTT_CONFIG.port}`;
        const topicState = `pid/esp32/${esp32_id}/state`;
        const topicStatus = `pid/esp32/${esp32_id}/status`;

        mqttClient = mqtt.connect(url, {
            username: MQTT_CONFIG.user || undefined,
            password: MQTT_CONFIG.pass || undefined,
            reconnectPeriod: 3000,
            connectTimeout: 5000,
        });

        mqttClient.on('connect', () => {
            console.log('MQTT connected: ' + url);
            mqttClient.subscribe([topicState, topicStatus]);
        });

        mqttClient.on('offline', () => {
            console.warn('MQTT offline, fallback to polling');
        });

        mqttClient.on('error', (err) => {
            console.error('MQTT error: ' + err.message);
        });

        mqttClient.on('message', (topic, payload, packet) => {
            if (!currentData) return;

            const message = payload.toString();
            if (topic === topicState) {
                // state ต้องไม่ retain: ข้อความเก่าที่ค้างใน broker จะกลายเป็นจุดแรกของกราฟทุกครั้งที่ refresh
                if (packet?.retain) {
                    console.warn('MQTT skip retained state: ' + message);
                    return;
                }
                onMqttState(message);
            } else if (topic === topicStatus) {
                onMqttStatus(message);
            }
        });
    }

    function onMqttState(message) {
        let data;
        try {
            data = JSON.parse(message);
        } catch (err) {
            console.warn('MQTT invalid JSON: ' + message);
            return;
        }
        if (!data || typeof data !== 'object') return;

        // รวมค่าใหม่เข้ากับค่าล่าสุด (ESP32 อาจส่งมาไม่ครบทุก field) ให้รูปแบบเหมือนข้อมูลจาก DB
        for (const [key, value] of Object.entries(data)) {
            if (typeof value === 'boolean') {
                currentData[key] = value ? 't' : 'f';
            } else if (DECIMAL_FIELDS.includes(key) && !isNaN(value)) {
                currentData[key] = Number(value).toFixed(2);
            } else {
                currentData[key] = value;
            }
        }

        // ช่วงยาวไม่ต้องเก็บทุกข้อความ ให้จำนวนจุดใกล้เคียง HISTORY_LIMIT เหมือนข้อมูลจาก DB
        const now = new Date();
        const lastAt = logs.length ? toTime(logs[logs.length - 1].created_at) : 0;
        if (now.getTime() - lastAt >= chartWindowMs / HISTORY_LIMIT) {
            logs.push({ ...currentData, created_at: now });
        }
        updateLiveInterval();
        pruneLogs();
        scheduleRender();
    }

    function onMqttStatus(message) {
        const status = message.trim().toLowerCase();
        if (status !== 'online' && status !== 'offline') return;

        mqttStatus = status === 'online' ? 't' : 'f';
        currentData.is_connected = mqttStatus;
        scheduleRender();
    }

    function setinitState() {
        const checkboxes = document.querySelectorAll(".allow-checkbox");
        checkboxes.forEach(cb => {
            cb.addEventListener("change", function () {

                const value = this.value;

                if (this.checked) {
                    // เพิ่มค่า
                    if (!allowKey.includes(value)) {
                        allowKey.push(value);
                    }

                } else {
                    // ลบค่า
                    allowKey = allowKey.filter(item => item !== value);
                }

                console.log("allowKey:", allowKey);
                scheduleRender();
            });
        });
    }


    async function loadDataById(id) {
        try {
            const res = await fetch(`../api/fetch-setsById.php?id=${id}&limit=${HISTORY_LIMIT}&window=${chartWindowMs / 1000}`);
            const raw = await res.json();
            const data = raw.data ?? [];

            return data;
        } catch (err) {
            console.error('error : ' + err);
        }
    }

    function setValueInHTML(data) {
        SetValueInHTMLById('sp', data['sp'] ?? '-');
        SetValueInHTMLById('error', data['error'] ?? '-');
        SetValueInHTMLById('kp', data['kp'] ?? '-');
        SetValueInHTMLById('ki', data['ki'] ?? '-');
        SetValueInHTMLById('kd', data['kd'] ?? '-');
        SetValueInHTMLById('pv', data['pv'] ?? '-');
        SetValueInHTMLById('mv', data['mv'] ?? '-');
        SetValueInHTMLById('relay', data['relay'] ?? '-');        SetValueInHTMLById('multi-kp', "x" + data['multi_kp'] ?? '-');
        SetValueInHTMLById('multi-ki', "x" + data['multi_ki'] ?? '-');
        SetValueInHTMLById('multi-kd', "x" + data['multi_kd'] ?? '-');
        // SetValueInHTMLById('sv', data['sv'] ?? '-');

        const is_conn = document.getElementById('is_connect');
        const is_status = document.getElementById('is_status');
        // ===== Update UI =====
        if (is_conn) {
            is_conn.textContent = data['is_connected'] == 't' ? "Connected" : "Not Connected";
        } else {
            console.warn('Not found Element id : is_connect');
        }

        if (is_status) {
            is_status.classList.remove(data['is_connected'] == 't' ? "bg-red-500" : "bg-green-500");
            is_status.classList.add(data['is_connected'] == 't' ? "bg-green-500" : "bg-red-500");
        } else {
            console.warn('Not found Element id : is_status');
        }

    }

    function prepareDatasets(data) {
        if (!data || !data.logs) return null;

        const logs = [...data.logs].sort((a, b) =>
            new Date(a.created_at) - new Date(b.created_at)
        );

        const labels = logs.map(item => item.created_at);
        const spData = logs.map(item => parseFloat(item.sp));
        const pvData = logs.map(item => parseFloat(item.pv));
        const kpData = logs.map(item => parseFloat(item.kp));
        const kiData = logs.map(item => parseFloat(item.ki));
        const kdData = logs.map(item => parseFloat(item.kd));
        const relayData = logs.map(item => parseFloat(item.relay));


        let datasets = [];
        let allValues = [];

        if (allowKey.includes('sp')) {
            datasets.push({
                label: 'SP',
                data: spData,
                borderColor: '#ef4444',
                backgroundColor: '#ef4444',
                borderWidth: 3,
                tension: 0.3,
                cubicInterpolationMode: 'monotone',
                pointRadius: 0,
                pointHoverRadius: 0
            });
            allValues.push(...spData);
        }

        if (allowKey.includes('pv')) {
            datasets.push({
                label: 'PV',
                data: pvData,
                borderColor: '#1A3FB8',
                backgroundColor: '#FFFFFF',
                borderWidth: 3,
                tension: 0.3,
                cubicInterpolationMode: 'monotone',
                pointRadius: 0,
                pointHoverRadius: 0
            });
            allValues.push(...pvData);
        }
        

        if (allowKey.includes('kp')) {
            datasets.push({
                label: 'Kp',
                data: kpData,
                borderColor: '#FFE600',
                backgroundColor: '#808080',
                borderWidth: 3,
                tension: 0.3,
                cubicInterpolationMode: 'monotone',
                pointRadius: 0,
                pointHoverRadius: 0
            });
            allValues.push(...kpData);
        }

        if (allowKey.includes('ki')) {
            datasets.push({
                label: 'Ki',
                data: kiData,
                borderColor: '#00FFFF',
                backgroundColor: '#808080',
                borderWidth: 3,
                tension: 0.3,
                cubicInterpolationMode: 'monotone',
                pointRadius: 0,
                pointHoverRadius: 0
            });
            allValues.push(...kiData);
        }

        if (allowKey.includes('kd')) {
            datasets.push({
                label: 'Kd',
                data: kdData,
                borderColor: '#8000FF',
                backgroundColor: '#808080',
                borderWidth: 3,
                tension: 0.3,
                cubicInterpolationMode: 'monotone',
                pointRadius: 0,
                pointHoverRadius: 0
            });
            allValues.push(...kdData);
        }

        if (allowKey.includes('relay')) {
            datasets.push({
                label: 'Relay',
                data: relayData,
                borderColor: '#F59E0B',
                backgroundColor: '#808080',
                borderWidth: 3,
                stepped: true,      // relay เปลี่ยนค่าเป็นขั้น ไม่ควรลากเส้นโค้งระหว่างจุด
                pointRadius: 0,
                pointHoverRadius: 0
            });
            allValues.push(...relayData);
        }

        // รวมข้อมูลทั้งหมดเพื่อหาค่า min / max

        const min = Math.min(...allValues);
        const max = Math.max(...allValues);

        return {
            labels,
            datasets,
            min,
            max
        };
    }

    function initChart(id, chartData) {

        if (!chartData) return;

        const ctx = document.getElementById(id);

        const yMax = chartData.max + chartData.max * 0.5;

        const axisColor = isDarkMode() ? '#FFFFFF' : '#6B7280';
        const timeScale = getTimeScale();

        if (!chart) {
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.labels,
                    datasets: chartData.datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: timeScale.unit,
                                displayFormats: {
                                    [timeScale.unit]: timeScale.format
                                },
                                tooltipFormat: 'HH:mm:ss.SSS'
                            },
                            ticks: {
                                color: axisColor,
                                autoSkip: true
                            },
                            grid: {
                                display: false
                            }
                        },
                        y: {
                            min: 0,
                            max: yMax,
                            ticks: {
                                font: { size: fontSize },
                                color: axisColor,
                                callback: v => v.toFixed(1)
                            },
                            grid: {
                                color: 'rgba(0,0,0,0.05)'
                            }
                        }
                    }
                }
            });
        } else {
            chart.data.labels = chartData.labels;
            chart.data.datasets = chartData.datasets;

            // chart.options.scales.y.min = yMin;
            chart.options.scales.y.max = yMax;
            chart.options.scales.x.time.unit = timeScale.unit;
            chart.options.scales.x.time.displayFormats = { [timeScale.unit]: timeScale.format };

            // 👇 update color ตอน update
            chart.options.scales.x.ticks.color = axisColor;
            chart.options.scales.y.ticks.color = axisColor;

            chart.options.scales.y.grid.color = isDarkMode()
                ? 'rgba(255,255,255,0.1)'
                : 'rgba(0,0,0,0.05)';

            chart.update('none');
        }
    }

</script>
