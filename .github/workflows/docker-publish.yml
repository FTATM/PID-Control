name: Build & Push Docker images

# รันเมื่อ push เข้า master, เมื่อสร้าง tag เช่น v1.0.0 หรือกดรันเองจากแท็บ Actions
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # อนุญาตให้ push image ขึ้น ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: pid-control        # PHP + Apache
            context: .
            file: ./Dockerfile
          - name: pid-control-mqtt   # Mosquitto
            context: ./docker/mosquitto
            file: ./docker/mosquitto/Dockerfile

    steps:
      - uses: actions/checkout@v4

      # รองรับทั้งเครื่อง x86 (PC/VPS) และ ARM (Raspberry Pi)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io ต้องใช้ชื่อตัวพิมพ์เล็ก
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      # สร้าง tag: latest (จาก master), 1.0.0 (จาก git tag v1.0.0), sha-xxxxxxx (ทุก commit)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
